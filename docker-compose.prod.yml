# Production-style overrides. Still SIMULATION ONLY: Yogii has no authorised
# sponsor-bank integration, and PAYMENT_MODE is fixed to simulation here.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating reverse proxy or load balancer in front of `web`
# (see docs/DEPLOYMENT.md). Secrets must come from a secrets manager.
services:
  migrate:
    environment: { APP_ENV: production, COOKIE_SECURE: "true" }
  seed:
    profiles: ["never"]   # no fictional data in production-style deployments
  api:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your HTTPS origin}
    restart: always
  web:
    restart: always
  db:
    restart: always
