services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yogii_db}
      POSTGRES_USER: ${POSTGRES_USER:-yogii_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yogii_user} -d ${POSTGRES_DB:-yogii_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-yogii_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yogii_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: "1440"
      YOGII_ENCRYPTION_KEY: ${YOGII_ENCRYPTION_KEY}
      YOGII_LOOKUP_HMAC_KEY: ${YOGII_LOOKUP_HMAC_KEY}
      YOGII_KEY_VERSION: "v1"
      PAYMENT_MODE: simulation
      LIVE_UPI_ENABLED: "false"
      MODEL_PATH: /app/backend/model/fraud_model.json
      MODEL_VERSION: 1.0.0-synthetic
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    command: ["python", "-m", "backend.worker.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-yogii_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yogii_db}
      REDIS_URL: redis://redis:6379/0
      YOGII_ENCRYPTION_KEY: ${YOGII_ENCRYPTION_KEY}
      YOGII_LOOKUP_HMAC_KEY: ${YOGII_LOOKUP_HMAC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - internal_network

  reverse-proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
