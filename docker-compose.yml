# Yogii local stack (SIMULATION ONLY).
#   ./scripts/generate-dev-env.sh    # once: writes .env with random local secrets
#   docker compose up --build        # then open http://localhost:8080
#
# The database sits on an internal network with no published port. The API is
# reachable only through the web container. Migrations run as the schema owner;
# the API connects as a least-privilege role.
name: yogii

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  PAYMENT_MODE: simulation
  LIVE_PAYMENTS_ENABLED: "false"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (run scripts/generate-dev-env.sh)}
  YOGII_ENCRYPTION_KEY: ${YOGII_ENCRYPTION_KEY:?Set YOGII_ENCRYPTION_KEY in .env}
  YOGII_LOOKUP_HMAC_KEY: ${YOGII_LOOKUP_HMAC_KEY:?Set YOGII_LOOKUP_HMAC_KEY in .env}
  MOCK_PROVIDER_WEBHOOK_SECRET: ${MOCK_PROVIDER_WEBHOOK_SECRET:?Set MOCK_PROVIDER_WEBHOOK_SECRET in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DB_AUTO_CREATE: "false"
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  MODEL_VERSION: ${MODEL_VERSION:-2.0.0-synthetic}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yogii}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      YOGII_MIGRATOR_PASSWORD: ${YOGII_MIGRATOR_PASSWORD:?Set YOGII_MIGRATOR_PASSWORD in .env}
      YOGII_APP_PASSWORD: ${YOGII_APP_PASSWORD:?Set YOGII_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-yogii}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://yogii_migrator:${YOGII_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-yogii}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  # Fictional demo data. Idempotent (skips if users exist) and refuses to run in production.
  seed:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "backend.scripts.seed"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://yogii_app:${YOGII_APP_PASSWORD}@db:5432/${POSTGRES_DB:-yogii}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    restart: "no"

  # Data-retention job (docs/SECURITY_AND_PRIVACY.md). Runs as the schema owner because the
  # app role can't delete audit-type data. Run on a schedule:
  #   docker compose --profile ops run --rm retention
  retention:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "backend.scripts.retention"]
    profiles: ["ops"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://yogii_migrator:${YOGII_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-yogii}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://yogii_app:${YOGII_APP_PASSWORD}@db:5432/${POSTGRES_DB:-yogii}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  web:
    build: { context: ./frontend }
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  backend:
    internal: true   # no route to the outside world; the database is never published
  edge: {}

volumes:
  pgdata: {}
