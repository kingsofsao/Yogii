services:
  postgres:
    image: postgres:16-alpine
    container_name: yogii_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yogii_db}
      POSTGRES_USER: ${POSTGRES_USER:-yogii_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yogii_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yogii_user} -d ${POSTGRES_DB:-yogii_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yogii_network

  redis:
    image: redis:7-alpine
    container_name: yogii_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yogii_network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yogii_api
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-yogii_user}:${POSTGRES_PASSWORD:-yogii_secret_password}@postgres:5432/${POSTGRES_DB:-yogii_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-super-secret-yogii-jwt-dev-key-change-in-production-12345}
      JWT_EXPIRY: "1440"
      YOGII_ENCRYPTION_KEY: ${YOGII_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      YOGII_LOOKUP_HMAC_KEY: ${YOGII_LOOKUP_HMAC_KEY:-fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}
      YOGII_KEY_VERSION: "v1"
      PAYMENT_MODE: simulation
      LIVE_UPI_ENABLED: "false"
      MODEL_PATH: /app/backend/model/fraud_model.json
      MODEL_VERSION: 1.0.0-synthetic
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yogii_network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yogii_worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-yogii_user}:${POSTGRES_PASSWORD:-yogii_secret_password}@postgres:5432/${POSTGRES_DB:-yogii_db}
      REDIS_URL: redis://redis:6379/0
      YOGII_ENCRYPTION_KEY: ${YOGII_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      YOGII_LOOKUP_HMAC_KEY: ${YOGII_LOOKUP_HMAC_KEY:-fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}
    command: ["python", "-m", "backend.worker.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yogii_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yogii_frontend
    environment:
      VITE_API_URL: /api
    networks:
      - yogii_network

  reverse-proxy:
    image: nginx:alpine
    container_name: yogii_proxy
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - yogii_network

networks:
  yogii_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
