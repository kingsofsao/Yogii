# Serves the SPA and proxies /api to the backend on the internal network.
# TLS: terminate HTTPS in front of this container in any shared or production
# deployment (see docs/DEPLOYMENT.md) and set COOKIE_SECURE=true.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_api.inc;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/conf.d/proxy_api.inc;
    }
}
